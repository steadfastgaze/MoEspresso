# License selection for dependency notices.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

# ring's BoringSSL, ISC and once_cell notices are separate files.
[ring.clarify]
license = "Apache-2.0 AND ISC AND MIT"

[[ring.clarify.files]]
