[package]
name = "moespresso"
version = "4.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Native inference for large sparse models"

[dependencies]
anyhow = "1"
half = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
minijinja = { version = "2.24", features = ["loader", "preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
tiny_http = "0.12"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
